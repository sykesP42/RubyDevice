name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build RubyDevice.sln -c Debug -p:Platform=x64

      - name: Test
        run: dotnet test RubyDevice.sln -c Debug -p:Platform=x64 --no-build
