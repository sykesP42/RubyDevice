name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Locate Appx packaging tasks
        id: appx
        shell: pwsh
        run: |
          # PRI generation needs the Appx packaging tasks shipped with Visual
          # Studio's MSBuild. Locate them with vswhere across any edition and
          # MSBuild version, then pass the directory to the build explicitly.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $candidates = @()
          if (Test-Path $vswhere) {
            $roots = & $vswhere -products * -property installationPath
            foreach ($root in $roots) {
              foreach ($v in 'v18.0', 'v17.0', 'v16.0') {
                $p = Join-Path $root "MSBuild\Microsoft\VisualStudio\$v\AppxPackage"
                if (Test-Path (Join-Path $p 'Microsoft.Build.Packaging.Pri.Tasks.dll')) {
                  $candidates += $p
                }
              }
            }
          }
          if ($candidates.Count -eq 0) {
            Write-Host "::error::No Visual Studio installation with the Appx packaging tasks (Microsoft.Build.Packaging.Pri.Tasks.dll) was found."
            exit 1
          }
          $dir = "$($candidates[0])\"
          Write-Host "Using Appx packaging tasks from: $dir"
          Add-Content $env:GITHUB_OUTPUT "appxpath=$dir"

      - name: Build
        run: dotnet build RubyDevice.sln -c Debug -p:Platform=x64 "-p:AppxMSBuildToolsPath=${{ steps.appx.outputs.appxpath }}" -p:TreatWarningsAsErrors=true

      - name: Verify formatting
        run: dotnet format RubyDevice.sln --verify-no-changes --no-restore
        env:
          AppxMSBuildToolsPath: ${{ steps.appx.outputs.appxpath }}

      - name: Test
        run: dotnet test RubyDevice.sln -c Debug -p:Platform=x64 "-p:AppxMSBuildToolsPath=${{ steps.appx.outputs.appxpath }}" --no-build

      - name: Audit vulnerable packages
        shell: pwsh
        run: |
          # dotnet list --vulnerable exits 0 even when vulnerable packages are
          # reported, so scan the output ourselves.
          $out = dotnet list RubyDevice.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match "has the following vulnerable") {
            Write-Host "::error::Vulnerable NuGet packages detected - run 'dotnet list RubyDevice.sln package --vulnerable --include-transitive' locally."
            exit 1
          }
